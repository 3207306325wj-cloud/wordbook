<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>我的生词本</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0f1420;--card:#171e2e;--line:#26304a;--fg:#e8ecf5;--dim:#8894ad;--acc:#4f8cff;--ok:#2ecc71;--no:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Microsoft YaHei",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom)) 0}
header{padding:14px 16px 6px;display:flex;align-items:baseline;gap:10px}
h1{font-size:19px;margin:0}
#stat{color:var(--dim);font-size:13px}
main{padding:0 12px}
.view{display:none}
.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
input,textarea,select{width:100%;background:#0c111c;color:var(--fg);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit}
textarea{min-height:64px;resize:vertical}
button{font:inherit;border:0;border-radius:11px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:600}
button.ghost{background:#222c44;color:var(--fg)}
button.sm{padding:7px 11px;font-size:13px;border-radius:9px}
button:active{transform:scale(.98)}
.row{display:flex;gap:10px;margin-top:12px}
.row>*{flex:1}
/* 背诵卡片 */
#flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:14px 0}
#fWord{font-size:34px;font-weight:700;letter-spacing:.5px;word-break:break-word}
#fWord small{display:block;font-size:13px;color:var(--dim);font-weight:400;margin-top:6px}
#fAns{margin-top:16px;font-size:19px;color:#cfe0ff;display:none}
#fAns.show{display:block}
#fEx{margin-top:10px;font-size:14px;color:var(--dim);display:none}
#fEx.show{display:block}
.hint{color:var(--dim);font-size:13px;text-align:center}
/* 列表 */
.item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .w{font-weight:700}
.item .m{color:#cfe0ff;font-size:14px;word-break:break-word}
.item .meta{color:var(--dim);font-size:12px;margin-top:2px}
.item .ops{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
/* 底部导航 */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#121828;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--dim);border-radius:0;padding:12px 4px;font-weight:500;font-size:13px}
nav button.on{color:var(--acc)}
nav button i{display:block;font-size:19px;font-style:normal;line-height:1.2}
.pill{display:inline-block;background:#22304d;color:#9db6e6;border-radius:999px;padding:2px 9px;font-size:12px;margin-right:6px}
.empty{color:var(--dim);text-align:center;padding:40px 10px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>我的生词本</h1>
  <span id="stat"></span>
</header>

<main>
  <!-- 背诵 -->
  <section class="view on" id="v-review">
    <div id="flash">
      <div id="fWord">—</div>
      <div id="fAns"></div>
      <div id="fEx"></div>
    </div>
    <div class="row" id="rowReveal">
      <button id="btnReveal">显示词义</button>
    </div>
    <div class="row" id="rowJudge" style="display:none">
      <button class="ghost" id="btnNo">不认识</button>
      <button id="btnYes">认识</button>
    </div>
    <p class="hint" id="reviewHint"></p>
  </section>

  <!-- 添加 -->
  <section class="view" id="v-add">
    <div class="card">
      <label for="inWord">单词 / 词组</label>
      <input id="inWord" placeholder="例如 inevitable" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label for="inMean">词义</label>
      <input id="inMean" placeholder="例如 不可避免的">
      <label for="inEx">例句（可选）</label>
      <textarea id="inEx" placeholder="遇到它的那个句子…"></textarea>
      <div class="row">
        <button id="btnSave">保存这个单词</button>
      </div>
      <p class="hint" id="addHint"></p>
    </div>
    <div class="card">
      <label for="inBulk">批量导入（每行：单词,词义）</label>
      <textarea id="inBulk" style="min-height:110px" placeholder="abandon,放弃&#10;abstract,抽象的&#10;accommodate 容纳"></textarea>
      <div class="row">
        <button class="ghost" id="btnBulk">批量导入</button>
      </div>
    </div>
  </section>

  <!-- 生词本 -->
  <section class="view" id="v-list">
    <div class="card" style="padding:10px 14px">
      <input id="inSearch" placeholder="搜索单词或词义…">
    </div>
    <div class="card" id="listBox"></div>
  </section>

  <!-- 设置 -->
  <section class="view" id="v-set">
    <div class="card">
      <label>数据备份 / 迁移</label>
      <p class="hint" style="text-align:left;margin:0 0 10px">换手机或重装浏览器前，先导出一份 JSON。</p>
      <div class="row">
        <button class="ghost" id="btnExport">导出 JSON</button>
        <button class="ghost" id="btnImport">导入 JSON</button>
      </div>
      <input type="file" id="fileImport" accept="application/json,.json" style="display:none">
    </div>
    <div class="card">
      <label>学习设置</label>
      <label for="inDaily">每天最多复习（个）</label>
      <input id="inDaily" type="number" min="5" max="500" value="40" inputmode="numeric">
      <div class="row">
        <button class="ghost" id="btnReset">清空全部数据</button>
      </div>
    </div>
    <p class="hint">数据保存在本机浏览器（localStorage），不会上传到任何服务器。</p>
  </section>
</main>

<nav>
  <button data-v="review" class="on"><i>🎯</i>背诵</button>
  <button data-v="add"><i>➕</i>添加</button>
  <button data-v="list"><i>📖</i>生词本</button>
  <button data-v="set"><i>⚙️</i>设置</button>
</nav>

<script>
(function(){
  "use strict";
  var KEY = "wordbook.v1";
  var DB = load();
  var cur = null, revealed = false, queue = [], qi = 0;

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return {words:[], daily:40, seq:1};
      var d = JSON.parse(raw);
      d.words = d.words || []; d.daily = d.daily || 40; d.seq = d.seq || 1;
      return d;
    }catch(e){ return {words:[], daily:40, seq:1}; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
    catch(e){ alert("保存失败：本机存储已满或被禁用。请先导出备份。"); }
    renderStat();
  }
  function today(){ return new Date().toISOString().slice(0,10); }
  function isDue(w){ return !w.due || w.due <= today(); }
  function $(id){ return document.getElementById(id); }

  /* ---------- 统计 ---------- */
  function renderStat(){
    var due = DB.words.filter(isDue).length;
    var learned = DB.words.filter(function(w){ return (w.box||1) >= 5; }).length;
    $("stat").textContent = "共 " + DB.words.length + " 词 · 待复习 " + due + " · 已掌握 " + learned;
  }

  /* ---------- 视图切换 ---------- */
  function show(v){
    ["review","add","list","set"].forEach(function(k){
      $("v-"+k).classList.toggle("on", k===v);
    });
    Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-v")===v);
    });
    if(v==="list") renderList();
    if(v==="review") nextCard(true);
    window.scrollTo(0,0);
  }
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function(b){
    b.addEventListener("click", function(){ show(b.getAttribute("data-v")); });
  });

  /* ---------- 添加 ---------- */
  function addWord(word, mean, ex){
    word = (word||"").trim(); mean = (mean||"").trim();
    if(!word || !mean) return false;
    var dup = DB.words.filter(function(w){ return w.word.toLowerCase() === word.toLowerCase(); })[0];
    if(dup){ dup.meaning = mean; if(ex) dup.example = ex; save(); return "dup"; }
    DB.words.push({
      id: DB.seq++, word: word, meaning: mean, example: (ex||"").trim(),
      box: 1, due: today(), right: 0, wrong: 0, created: Date.now()
    });
    save(); return true;
  }
  $("btnSave").addEventListener("click", function(){
    var r = addWord($("inWord").value, $("inMean").value, $("inEx").value);
    var h = $("addHint");
    if(r === true){ h.textContent = "✔ 已保存：" + $("inWord").value.trim(); $("inWord").value=""; $("inMean").value=""; $("inEx").value=""; $("inWord").focus(); }
    else if(r === "dup"){ h.textContent = "这个单词已经有了，已更新词义。"; }
    else { h.textContent = "单词和词义都要填。"; }
    h.style.color = (r ? "#2ecc71" : "#ff5d5d");
  });

  $("btnBulk").addEventListener("click", function(){
    var lines = $("inBulk").value.split(/\r?\n/);
    var n = 0;
    lines.forEach(function(ln){
      ln = ln.trim(); if(!ln) return;
      var p = ln.split(/\s*[,，\t]\s*/);
      if(p.length < 2){ p = ln.split(/\s+/); }
      if(p.length >= 2){
        var w = p[0], m = p.slice(1).join(" ");
        if(addWord(w, m)) n++;
      }
    });
    $("inBulk").value = "";
    var h = $("addHint"); h.textContent = "批量导入完成：" + n + " 个"; h.style.color = "#2ecc71";
    show("list");
  });

  /* ---------- 背诵 ---------- */
  function buildQueue(){
    var due = DB.words.filter(isDue);
    // 盒子号小的优先（越不熟越先考）
    due.sort(function(a,b){ return (a.box||1) - (b.box||1) || a.id - b.id; });
    queue = due.slice(0, DB.daily);
    qi = 0;
  }
  function nextCard(reset){
    if(reset) buildQueue();
    if(!queue.length || qi >= queue.length){
      if(DB.words.length === 0){
        $("fWord").textContent = "还没有单词";
        $("fAns").className = ""; $("fEx").className = "";
        $("rowReveal").style.display = "flex"; $("rowJudge").style.display = "none";
        $("reviewHint").textContent = "去「添加」页把遇到的生词存进来吧。";
        return;
      }
      $("fWord").textContent = "今天的复习完成了 🎉";
      $("fAns").className = ""; $("fEx").className = "";
      $("rowReveal").style.display = "flex"; $("rowJudge").style.display = "none";
      $("reviewHint").textContent = "全部 " + DB.words.length + " 词都在计划内，明天再来。";
      return;
    }
    cur = queue[qi]; revealed = false;
    $("fWord").innerHTML = "";
    $("fWord").appendChild(document.createTextNode(cur.word));
    var small = document.createElement("small");
    small.textContent = "第 " + (qi+1) + " / " + queue.length + " 个 · 等级 " + (cur.box||1);
    $("fWord").appendChild(small);
    $("fAns").textContent = cur.meaning;
    $("fAns").className = "";
    if(cur.example){ $("fEx").textContent = cur.example; $("fEx").className = ""; }
    else { $("fEx").textContent = ""; $("fEx").className = ""; }
    $("rowReveal").style.display = "flex";
    $("rowJudge").style.display = "none";
    $("reviewHint").textContent = "先自己想，想不出来再点「显示词义」。";
  }
  $("btnReveal").addEventListener("click", function(){
    if(!cur) return;
    revealed = true;
    $("fAns").className = "show";
    if(cur.example) $("fEx").className = "show";
    $("rowReveal").style.display = "none";
    $("rowJudge").style.display = "flex";
    $("reviewHint").textContent = "想对了吗？";
  });
  function grade(ok){
    if(!cur) return;
    if(ok){
      cur.right = (cur.right||0)+1;
      cur.box = Math.min(5, (cur.box||1)+1);
    }else{
      cur.wrong = (cur.wrong||0)+1;
      cur.box = 1;
    }
    var days = [0,1,2,4,7,15][cur.box] || 1;
    var d = new Date(); d.setDate(d.getDate() + days);
    cur.due = d.toISOString().slice(0,10);
    save();
    qi++;
    nextCard(false);
  }
  $("btnYes").addEventListener("click", function(){ grade(true); });
  $("btnNo").addEventListener("click", function(){ grade(false); });

  /* ---------- 生词本 ---------- */
  function renderList(){
    var q = ($("inSearch").value||"").trim().toLowerCase();
    var box = $("listBox");
    var arr = DB.words.slice().sort(function(a,b){ return b.id - a.id; });
    if(q) arr = arr.filter(function(w){ return (w.word+" "+w.meaning).toLowerCase().indexOf(q) >= 0; });
    if(!arr.length){ box.innerHTML = '<p class="empty">' + (DB.words.length ? "没有匹配的词" : "还没有生词，去「添加」页加第一个吧") + '</p>'; return; }
    var html = "";
    arr.forEach(function(w){
      html += '<div class="item" data-id="'+w.id+'">'
        + '<div><div class="w">'+esc(w.word)+'</div>'
        + '<div class="m">'+esc(w.meaning)+'</div>'
        + (w.example ? '<div class="meta">'+esc(w.example)+'</div>' : '')
        + '<div class="meta"><span class="pill">等级 '+(w.box||1)+'</span>对 '+(w.right||0)+' · 错 '+(w.wrong||0)+(w.due?' · 下次 '+w.due:'')+'</div></div>'
        + '<div class="ops"><button class="sm ghost" data-act="del">删</button></div></div>';
    });
    box.innerHTML = html;
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  $("inSearch").addEventListener("input", renderList);
  $("listBox").addEventListener("click", function(e){
    var b = e.target.closest('button[data-act="del"]');
    if(!b) return;
    var id = parseInt(b.closest(".item").getAttribute("data-id"), 10);
    var w = DB.words.filter(function(x){ return x.id === id; })[0];
    if(w && confirm('删除「' + w.word + '」？')){ DB.words = DB.words.filter(function(x){ return x.id !== id; }); save(); renderList(); nextCard(true); }
  });

  /* ---------- 设置 ---------- */
  $("inDaily").addEventListener("change", function(){
    DB.daily = Math.max(5, Math.min(500, parseInt(this.value,10) || 40));
    this.value = DB.daily; save();
  });
  $("btnExport").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "生词本-" + today() + ".json";
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  });
  $("btnImport").addEventListener("click", function(){ $("fileImport").click(); });
  $("fileImport").addEventListener("change", function(e){
    var f = e.target.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var d = JSON.parse(rd.result);
        if(!d.words || !d.words.length) throw new Error("文件里没有单词");
        if(confirm("导入 " + d.words.length + " 个单词？\n（会与现有数据合并，重名以导入为准）")){
          d.words.forEach(function(w){ addWord(w.word, w.meaning, w.example); });
          alert("导入完成");
          renderStat(); renderList();
        }
      }catch(err){ alert("导入失败：" + err.message); }
    };
    rd.readAsText(f);
  });
  $("btnReset").addEventListener("click", function(){
    if(confirm("确定清空全部 " + DB.words.length + " 个单词？此操作不可恢复，建议先导出备份。")){
      DB = {words:[], daily:DB.daily, seq:1}; save(); renderList(); nextCard(true);
    }
  });

  /* ---------- 启动 ---------- */
  $("inDaily").value = DB.daily;
  renderStat();
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
})();
</script>
</body>
</html>
